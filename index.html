<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  .libro { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
  button { cursor: pointer; padding: 6px 12px; border: 1px solid #333; background: #fff; border-radius: 4px; }
  button:hover { background: #333; color: #fff; }
  input { padding: 6px; margin-bottom: 16px; width: 100%; box-sizing: border-box; }
  #estado { font-weight: bold; min-height: 1.2em; margin: 12px 0; }
  #historial { font-size: 0.9rem; color: #555; }
</style>
</head>
<body>
  <h1>📚 Biblioteca</h1>
  <label for="socio">Nombre del socio</label>
  <input id="socio" placeholder="Ej: Ana Torres">

  <h2>Catálogo</h2>
  <div id="catalogo"></div>

  <p id="estado"></p>

  <h2>Historial de préstamos</h2>
  <ul id="historial"></ul>

  <script type="module" src="src/app.js"></script>
</body>
</html>
